<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <linearGradient id="bgH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <radialGradient id="topGlowH" cx="0.5" cy="0" r="0.9">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomShadeH" cx="0.5" cy="1" r="0.8">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="textH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="softGlowH" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon block (left) -->
  <g transform="translate(40 40)">
    <rect width="280" height="280" rx="64" fill="url(#bgH)"/>
    <rect width="280" height="280" rx="64" fill="url(#topGlowH)"/>
    <rect width="280" height="280" rx="64" fill="url(#bottomShadeH)"/>

    <circle cx="92" cy="160" r="3" fill="#ffffff" opacity="0.35"/>
    <circle cx="115" cy="124" r="3.5" fill="#ffffff" opacity="0.5"/>
    <circle cx="163" cy="80" r="4" fill="#ffffff" opacity="0.55"/>
    <circle cx="188" cy="108" r="3.5" fill="#ffffff" opacity="0.45"/>

    <path d="M 70 184 Q 140 36, 210 184"
          stroke="#ffffff" stroke-width="20"
          fill="none" stroke-linecap="round"/>

    <circle cx="70" cy="184" r="18" fill="#ffffff"/>
    <circle cx="66" cy="180" r="5" fill="#ffffff" opacity="0.55"/>

    <circle cx="210" cy="184" r="27" fill="url(#accentH)" filter="url(#softGlowH)"/>
    <circle cx="210" cy="184" r="27" fill="url(#accentH)"/>
    <ellipse cx="203" cy="175" rx="9" ry="6" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Wordmark "hops" — custom geometric letters -->
  <g transform="translate(380 110)" fill="url(#textH)">
    <!-- h -->
    <path d="M 0 0
             L 0 180
             L 36 180
             L 36 110
             C 36 96, 44 88, 58 88
             C 72 88, 80 96, 80 110
             L 80 180
             L 116 180
             L 116 100
             C 116 70, 98 52, 70 52
             C 56 52, 44 58, 36 70
             L 36 0
             Z"/>
    <!-- o -->
    <g transform="translate(140 0)">
      <path d="M 60 52
               C 24 52, 0 80, 0 118
               C 0 156, 24 184, 60 184
               C 96 184, 120 156, 120 118
               C 120 80, 96 52, 60 52
               Z
               M 60 84
               C 78 84, 88 98, 88 118
               C 88 138, 78 152, 60 152
               C 42 152, 32 138, 32 118
               C 32 98, 42 84, 60 84
               Z"
            fill-rule="evenodd"/>
    </g>
    <!-- p -->
    <g transform="translate(276 0)">
      <path d="M 0 56
               L 36 56
               L 36 76
               C 44 60, 60 52, 78 52
               C 110 52, 132 80, 132 118
               C 132 156, 110 184, 78 184
               C 62 184, 48 178, 40 168
               L 40 240
               L 0 240
               Z
               M 64 84
               C 48 84, 38 98, 38 118
               C 38 138, 48 152, 64 152
               C 82 152, 92 138, 92 118
               C 92 98, 82 84, 64 84
               Z"
            fill-rule="evenodd"/>
    </g>
    <!-- s -->
    <g transform="translate(424 0)">
      <path d="M 8 158
               L 28 132
               C 38 144, 52 152, 66 152
               C 78 152, 86 148, 86 140
               C 86 132, 78 128, 60 124
               C 30 118, 8 108, 8 84
               C 8 64, 28 52, 56 52
               C 76 52, 92 58, 104 70
               L 84 96
               C 76 86, 66 82, 56 82
               C 46 82, 40 86, 40 92
               C 40 100, 50 102, 64 106
               C 96 112, 118 122, 118 146
               C 118 168, 96 184, 64 184
               C 40 184, 22 176, 8 158
               Z"/>
    </g>
  </g>

  <!-- Tagline -->
  <text x="382" y="328"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30"
        font-weight="600"
        letter-spacing="8"
        fill="#6b7280">KAMPÜSÜN AKIŞI</text>
</svg>
