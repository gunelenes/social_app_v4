<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="0.5" cy="0" r="0.9">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomShade" cx="0.5" cy="1" r="0.8">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background layers -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#topGlow)"/>
  <rect width="512" height="512" rx="116" fill="url(#bottomShade)"/>

  <!-- Subtle dotted trail (motion implication) -->
  <circle cx="178" cy="296" r="5" fill="#ffffff" opacity="0.35"/>
  <circle cx="216" cy="232" r="6" fill="#ffffff" opacity="0.5"/>
  <circle cx="296" cy="152" r="7" fill="#ffffff" opacity="0.55"/>
  <circle cx="338" cy="200" r="6" fill="#ffffff" opacity="0.45"/>

  <!-- Hop arc (parabolic leap) -->
  <path d="M 132 332 Q 256 60, 380 332"
        stroke="url(#arcGrad)"
        stroke-width="34"
        fill="none"
        stroke-linecap="round"/>

  <!-- Origin dot (left) -->
  <circle cx="132" cy="332" r="30" fill="#ffffff"/>
  <circle cx="124" cy="324" r="9" fill="#ffffff" opacity="0.5"/>

  <!-- Landing dot (right) — accent amber -->
  <circle cx="380" cy="332" r="48" fill="url(#accent)" filter="url(#softGlow)"/>
  <circle cx="380" cy="332" r="48" fill="url(#accent)"/>
  <!-- Inner highlight on landing dot -->
  <ellipse cx="368" cy="316" rx="16" ry="11" fill="#ffffff" opacity="0.5"/>
</svg>
