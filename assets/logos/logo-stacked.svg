             Z"/>
    <!-- o -->
    <g transform="translate(140 0)">
      <path d="M 60 52
               C 24 52, 0 80, 0 118
               C 0 156, 24 184, 60 184
               C 96 184, 120 156, 120 118
               C 120 80, 96 52, 60 52
               Z
               M 60 84
               C 78 84, 88 98, 88 118
               C 88 138, 78 152, 60 152
               C 42 152, 32 138, 32 118
               C 32 98, 42 84, 60 84
               Z"
            fill-rule="evenodd"/>
    </g>
    <!-- p -->
    <g transform="translate(276 0)">
      <path d="M 0 56
               L 36 56
               L 36 76
               C 44 60, 60 52, 78 52
               C 110 52, 132 80, 132 118
               C 132 156, 110 184, 78 184
               C 62 184, 48 178, 40 168
               L 40 240
               L 0 240
               Z
               M 64 84
               C 48 84, 38 98, 38 118
               C 38 138, 48 152, 64 152
               C 82 152, 92 138, 92 118
               C 92 98, 82 84, 64 84
               Z"
            fill-rule="evenodd"/>
    </g>
    <!-- s -->
    <g transform="translate(424 0)">
      <path d="M 8 158
               L 28 132
               C 38 144, 52 152, 66 152
               C 78 152, 86 148, 86 140
               C 86 132, 78 128, 60 124
               C 30 118, 8 108, 8 84
               C 8 64, 28 52, 56 52
               C 76 52, 92 58, 104 70
               L 84 96
               C 76 86, 66 82, 56 82
               C 46 82, 40 86, 40 92
               C 40 100, 50 102, 64 106
               C 96 112, 118 122, 118 146
               C 118 168, 96 184, 64 184
               C 40 184, 22 176, 8 158
               Z"/>
    </g>
  </g>

  <!-- Tagline -->
  <text x="360" y="744"
        text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30"
        font-weight="600"
        letter-spacing="10"
        fill="#6b7280">KAMPÜSÜN AKIŞI</text>
</svg>
