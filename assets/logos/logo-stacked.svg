             L 0 180
             L 36 180
             L 36 110
             C 36 96, 44 88, 58 88
             C 72 88, 80 96, 80 110
             L 80 180
             L 116 180
             L 116 100
             C 116 70, 98 52, 70 52
             C 56 52, 44 58, 36 70
