<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" width="720" height="800">
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <radialGradient id="topGlowS" cx="0.5" cy="0" r="0.9">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomShadeS" cx="0.5" cy="1" r="0.8">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="textS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="softGlowS" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon block (centered top) -->
  <g transform="translate(160 60)">
    <rect width="400" height="400" rx="92" fill="url(#bgS)"/>
    <rect width="400" height="400" rx="92" fill="url(#topGlowS)"/>
    <rect width="400" height="400" rx="92" fill="url(#bottomShadeS)"/>

    <circle cx="138" cy="226" r="4" fill="#ffffff" opacity="0.35"/>
    <circle cx="170" cy="178" r="5" fill="#ffffff" opacity="0.5"/>
    <circle cx="232" cy="116" r="5.5" fill="#ffffff" opacity="0.55"/>
    <circle cx="264" cy="154" r="5" fill="#ffffff" opacity="0.45"/>

    <path d="M 102 260 Q 200 50, 298 260"
          stroke="#ffffff" stroke-width="28"
          fill="none" stroke-linecap="round"/>

    <circle cx="102" cy="260" r="25" fill="#ffffff"/>
    <circle cx="96" cy="254" r="7" fill="#ffffff" opacity="0.55"/>

    <circle cx="298" cy="260" r="38" fill="url(#accentS)" filter="url(#softGlowS)"/>
    <circle cx="298" cy="260" r="38" fill="url(#accentS)"/>
    <ellipse cx="288" cy="248" rx="12" ry="8" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Wordmark "hops" centered -->
  <g transform="translate(216 520)" fill="url(#textS)">
    <!-- h -->
